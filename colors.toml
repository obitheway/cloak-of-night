# Cloak of Night
# A void-purple palette drawn from Jason Asano's dark, blood and sin essences:
# living shadow stitched with starlight, neon sin, blood, and the gold of his soul crest.
mode = "dark"

accent = "#ff2e97"
selection = "#3a1747"
muted = "#6b5a80"

background = "#0b0614"
dark_background = "#070310"
darker_background = "#04020a"
lighter_background = "#1c1030"

foreground = "#efe2fa"
dark_foreground = "#8f7da8"
light_foreground = "#f5ebfc"
bright_foreground = "#fbf5ff"

hyprland_active_border = "rgba(1ce6e9ee) rgba(ff2e97ee) rgba(e01b3cee) 45deg"
hyprland_inactive_border = "rgba(6b5a80aa)"

red = "#e01b3c"
yellow = "#ffc857"
orange = "#ff7a45"
green = "#3fd08a"
cyan = "#1ce6e9"
blue = "#4d7cff"
magenta = "#ff2e97"
brown = "#6b2d4a"

bright_red = "#ff4d6a"
bright_yellow = "#ffd97a"
bright_green = "#6ee7b0"
bright_cyan = "#5ff6fa"
bright_blue = "#7aa2ff"
bright_magenta = "#ff6ab5"

# A true violet for the terminal's purple slot; without this it aliases to the
# pink accent and the palette stops feeling purple.
purple = "#b26bff"
bright_purple = "#d6a8ff"

# A vivid neon orange for quoted strings, so they read as Gordon's butterflies
# without collapsing into the deeper coral orange used for numbers.
ember = "#FF991C"

# App icons: a void-violet body fading into neon sin-pink, with cyan star marks.
icon_main = "#b26bff"
icon_main_end = "#ff2e97"
icon_mark = "#1ce6e9"

# Pin the selection pair so every editor and terminal agrees exactly.
selection_foreground = "#fbf5ff"
selection_background = "#3a1747"
